# Home Assistant Kiosk — example configuration
#
# Copy this file to /etc/ha-kiosk/config.toml, replace the placeholders with
# your own Home Assistant URL and entity IDs, and keep the file readable only
# by the service user (mode 0600).
#
# Do not commit a filled-in copy of this file. It contains no real values by
# design; every entity below is a placeholder.

# ---------------------------------------------------------------------------
# Home Assistant connection
# ---------------------------------------------------------------------------

[ha]
# Use http:// for a local instance without TLS, https:// for TLS.
# A path prefix is preserved, e.g. https://example.test/ha.
# The WebSocket URL (ws:// or wss://) is derived automatically.
url = "http://homeassistant.local:8123"

# Preferred: a file containing only the long-lived access token.
# The file must be mode 0600 and owned by the service user.
token_file = "/etc/ha-kiosk/ha_token"

# Development only. Prefer token_file or the HA_TOKEN environment variable.
# token = "REPLACE_ME"

# Leave false unless you understand the risk. Prefer installing the CA
# certificate on the device instead of disabling verification.
allow_invalid_certs = false

# Optional IANA timezone used only if Home Assistant's get_config response does
# not provide one. Example: "Europe/Berlin". Leave unset to use get_config,
# then the device timezone.
# time_zone = "Europe/Berlin"

# Optional extra entities to subscribe to, in addition to the entities
# referenced by the widgets and tiles below. Useful for templates or future
# widgets. Example: ["sensor.example"]
extra_entity_ids = []

# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------

[display]
# Desktop window size and layout-test reference. On LinuxKMS the DRM mode wins;
# use SLINT_DRM_MODE to select a mode. Keep layouts responsive.
width = 800
height = 480
# 0, 90, 180, or 270. On LinuxKMS this maps to SLINT_KMS_ROTATION.
rotation = 0
fullscreen = true
# "dark" or "light". The dark theme is the default target.
theme = "dark"

# ---------------------------------------------------------------------------
# Pages
#
# The page set is fixed in v1: overview, media, agenda, status.
# A page renders the widgets listed for it. Omit a page table to use the
# default widget list. "tiles" refers to the [tiles] grid below; "status" is a
# built-in read-only page and has no widget table.
# ---------------------------------------------------------------------------

[pages.overview]
widgets = ["clock", "weather", "tiles", "departures"]

[pages.media]
widgets = ["media"]

[pages.agenda]
widgets = ["calendar"]

[pages.status]
widgets = ["status"]

# ---------------------------------------------------------------------------
# Widgets
# ---------------------------------------------------------------------------

[widgets.clock]
enabled = true
show_seconds = false
use_24_hour = true

[widgets.weather]
enabled = true
entity = "weather.home"
forecast_type = "daily" # "daily" or "hourly"
forecast_count = 3
refresh_seconds = 900

[widgets.media]
enabled = true
entity = "media_player.living_room"
show_album_art = true
volume_step = 0.05

[widgets.departures]
enabled = true
entity = "sensor.departures"
title = "Departures"
max_items = 6
refresh_seconds = 60

[widgets.calendar]
enabled = true
entities = ["calendar.family"]
days = 2
refresh_seconds = 300

# ---------------------------------------------------------------------------
# Tiles
#
# Supported domains in v1: switch, input_boolean, light, scene, script,
# cover, climate (read-only), sensor, binary_sensor, weather (read-only).
# Unsupported domains render read-only. See PLAN.md section 4.3.
# ---------------------------------------------------------------------------

[tiles]
columns = 3

[[tiles.items]]
entity = "light.example"
label = "Example light"
icon = "light"

[[tiles.items]]
entity = "switch.example"
label = "Example switch"
icon = "switch"

[[tiles.items]]
entity = "sensor.example_temperature"
label = "Temperature"
icon = "thermometer"

[[tiles.items]]
entity = "scene.example"
label = "Example scene"
icon = "scene"

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------

[cache]
# The service user must be able to create and replace this file.
# The directory is mode 0700 and the file 0600.
path = "/var/lib/ha-kiosk/state.json"
# Debounce writes to reduce SD-card wear. Minimum 2 seconds.
write_debounce_seconds = 10
# Upper bound for the cache file. Older/incompatible caches are discarded.
max_bytes = 262144

# ---------------------------------------------------------------------------
# Community extension shop (Wave 6; disabled in v1)
# ---------------------------------------------------------------------------

[extensions]
# When true, the kiosk adds a fifth Shop page. It lists installed and available
# extensions, shows permissions, and installs, updates, removes, enables, or
# disables them after a first-install trust confirmation. Installed extensions
# stay usable while the catalog is offline.
#
# Enabling the shop requires catalog_url and public_keys. Unsigned or HTTP
# catalogs are accepted only with allow_unsigned and dev_mode both true.
enabled = false
# HTTPS URL of the signed catalog index in the separate catalog repository.
catalog_url = "https://raw.githubusercontent.com/example/home-assistant-kiosk-extensions/main/index.json"
# Minisign public keys (base64). The matching private key never enters this repo.
public_keys = []
# Development only. A production shop must reject unsigned catalogs.
allow_unsigned = false
# Development only: permit HTTP (not HTTPS) catalog/package URLs for a local catalog.
dev_mode = false
refresh_hours = 24
max_catalog_bytes = 2097152
max_package_bytes = 5242880
max_script_operations = 1000000
# Installed extensions and the last verified catalog index (absolute path,
# created with mode 0700; installed.json is mode 0600).
store_path = "/var/lib/ha-kiosk/extensions"

# Per-extension settings go here. The shop shows the required keys.
# [extensions.settings."org.example.bus-departures"]
# stop_id = "REPLACE_ME"
# limit = 6

# Secret fields for an extension live in a separate file with mode 0600:
# /etc/ha-kiosk/extensions/<extension-id>.secret.toml
