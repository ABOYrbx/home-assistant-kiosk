[package]
name = "ha-kiosk"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A native Home Assistant kiosk dashboard"
license = "UNSPECIFIED"

[dependencies]
rhai = { version = "1", features = ["sync", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
thiserror = "2"
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking", "rustls-no-provider", "json",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring", "std", "tls12",
] }

[dev-dependencies]
tempfile = "3"
