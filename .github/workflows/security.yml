name: security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, so a new advisory fails the repository even without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0

      - name: Audit dependencies
        run: cargo audit --file Cargo.lock
