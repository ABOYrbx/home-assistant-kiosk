name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    # Fork pull requests are untrusted: keep them on GitHub-hosted runners.
    # Pushes to main, same-repo PRs and manual runs use the self-hosted Debian machine.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","debian"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install system dependencies
        # The self-hosted runner has these preinstalled and its account has no sudo.
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            build-essential pkg-config \
            libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libdrm-dev libgbm-dev \
            libseat-dev libinput-dev libudev-dev

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy (desktop)
        run: cargo clippy --all-targets --features desktop -- -D warnings

      - name: cargo test (desktop)
        run: cargo test --features desktop

      - name: cargo build (kiosk)
        run: cargo build --release --no-default-features --features kiosk
